development:
  adapter: redis
  url: redis://localhost:6379/1

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { pw = ENV["REDIS_PASSWORD"].to_s; auth = pw.empty? ? "" : ":#{CGI.escape(pw)}@"; "redis://#{auth}#{ENV.fetch('REDIS_HOST', 'localhost')}:#{ENV.fetch('REDIS_PORT', 6379)}/1" } %>
  channel_prefix: RVA_production
